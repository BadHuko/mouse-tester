name: Build portable exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/make_icon.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name MouseTester --icon assets/icon.ico --add-data "assets;assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MouseTester
          path: dist/MouseTester.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MouseTester.exe
          body_path: .github/release-notes.md
